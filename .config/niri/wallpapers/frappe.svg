<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <!-- Catppuccin Frappé wallpaper for the niri session: the theme's dark tones with soft
       glows of its accent colours. The theme picker links
       ~/.config/niri/wallpaper here. -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#303446"/>
      <stop offset="1" stop-color="#232634"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="260"/>
    </filter>
  </defs>
  <rect width="3840" height="2160" fill="url(#base)"/>
  <g filter="url(#soft)">
    <ellipse cx="700"  cy="420"  rx="900" ry="520" fill="#babbf1" opacity="0.30"/>
    <ellipse cx="3200" cy="1750" rx="1000" ry="600" fill="#ca9ee6" opacity="0.26"/>
    <ellipse cx="2500" cy="700"  rx="600" ry="380" fill="#99d1db" opacity="0.12"/>
  </g>
</svg>
