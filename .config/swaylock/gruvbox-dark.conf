# swaylock, the lock screen of the niri session, in Gruvbox Dark. The theme picker
# links ~/.config/swaylock/config here.
ignore-empty-password
show-failed-attempts
# The wallpaper (passed with -i) covers the screen; color shows without it.
scaling=fill
font=FiraCode Nerd Font
indicator-radius=100
indicator-thickness=8
color=1d2021
inside-color=282828
inside-clear-color=282828
inside-ver-color=282828
inside-wrong-color=282828
ring-color=83a598
ring-clear-color=fabd2f
ring-ver-color=83a598
ring-wrong-color=fb4934
key-hl-color=b8bb26
bs-hl-color=fb4934
line-color=00000000
line-clear-color=00000000
line-ver-color=00000000
line-wrong-color=00000000
separator-color=00000000
text-color=ebdbb2
text-clear-color=ebdbb2
text-ver-color=ebdbb2
text-wrong-color=fb4934
