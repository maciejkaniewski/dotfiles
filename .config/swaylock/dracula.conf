# swaylock, the lock screen of the niri session, in Dracula. The theme picker
# links ~/.config/swaylock/config here.
ignore-empty-password
show-failed-attempts
# The wallpaper (passed with -i) covers the screen; color shows without it.
scaling=fill
font=FiraCode Nerd Font
indicator-radius=100
indicator-thickness=8
color=21222c
inside-color=282a36
inside-clear-color=282a36
inside-ver-color=282a36
inside-wrong-color=282a36
ring-color=bd93f9
ring-clear-color=f1fa8c
ring-ver-color=8be9fd
ring-wrong-color=ff5555
key-hl-color=50fa7b
bs-hl-color=ff5555
line-color=00000000
line-clear-color=00000000
line-ver-color=00000000
line-wrong-color=00000000
separator-color=00000000
text-color=f8f8f2
text-clear-color=f8f8f2
text-ver-color=f8f8f2
text-wrong-color=ff5555
