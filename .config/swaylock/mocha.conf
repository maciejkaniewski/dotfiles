# swaylock, the lock screen of the niri session, in Catppuccin Mocha. The theme picker
# links ~/.config/swaylock/config here.
ignore-empty-password
show-failed-attempts
# The wallpaper (passed with -i) covers the screen; color shows without it.
scaling=fill
font=FiraCode Nerd Font
indicator-radius=100
indicator-thickness=8
color=11111b
inside-color=1e1e2e
inside-clear-color=1e1e2e
inside-ver-color=1e1e2e
inside-wrong-color=1e1e2e
ring-color=b4befe
ring-clear-color=f9e2af
ring-ver-color=89dceb
ring-wrong-color=f38ba8
key-hl-color=a6e3a1
bs-hl-color=f38ba8
line-color=00000000
line-clear-color=00000000
line-ver-color=00000000
line-wrong-color=00000000
separator-color=00000000
text-color=cdd6f4
text-clear-color=cdd6f4
text-ver-color=cdd6f4
text-wrong-color=f38ba8
