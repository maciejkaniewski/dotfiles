# swaylock, the lock screen of the niri session, in Catppuccin Macchiato. The theme picker
# links ~/.config/swaylock/config here.
ignore-empty-password
show-failed-attempts
# The wallpaper (passed with -i) covers the screen; color shows without it.
scaling=fill
font=FiraCode Nerd Font
indicator-radius=100
indicator-thickness=8
color=181926
inside-color=24273a
inside-clear-color=24273a
inside-ver-color=24273a
inside-wrong-color=24273a
ring-color=b7bdf8
ring-clear-color=eed49f
ring-ver-color=91d7e3
ring-wrong-color=ed8796
key-hl-color=a6da95
bs-hl-color=ed8796
line-color=00000000
line-clear-color=00000000
line-ver-color=00000000
line-wrong-color=00000000
separator-color=00000000
text-color=cad3f5
text-clear-color=cad3f5
text-ver-color=cad3f5
text-wrong-color=ed8796
