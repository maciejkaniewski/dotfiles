# swaylock, the lock screen of the niri session, in Catppuccin Frappé. The theme picker
# links ~/.config/swaylock/config here.
ignore-empty-password
show-failed-attempts
# The wallpaper (passed with -i) covers the screen; color shows without it.
scaling=fill
font=FiraCode Nerd Font
indicator-radius=100
indicator-thickness=8
color=232634
inside-color=303446
inside-clear-color=303446
inside-ver-color=303446
inside-wrong-color=303446
ring-color=babbf1
ring-clear-color=e5c890
ring-ver-color=99d1db
ring-wrong-color=e78284
key-hl-color=a6d189
bs-hl-color=e78284
line-color=00000000
line-clear-color=00000000
line-ver-color=00000000
line-wrong-color=00000000
separator-color=00000000
text-color=c6d0f5
text-clear-color=c6d0f5
text-ver-color=c6d0f5
text-wrong-color=e78284
