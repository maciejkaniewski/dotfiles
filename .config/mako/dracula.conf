# mako, the notification daemon of the niri session, in Dracula. mako has no
# include, so each theme is a whole config; the theme picker links
# ~/.config/mako/config to one of them.
font=FiraCode Nerd Font 11
background-color=#282a36ee
text-color=#f8f8f2
border-color=#bd93f9
progress-color=over #44475a
border-size=2
border-radius=8
padding=10
width=380
default-timeout=8000
max-icon-size=40
icon-location=left
# Notifications from one app stack into one, with a count.
group-by=app-name
format=<b>%s</b>\n%b

[grouped]
format=<b>%s</b>  <span alpha="60%%">(%g)</span>\n%b

[urgency=high]
border-color=#ff5555
border-size=3
background-color=#282a36f5
default-timeout=0
