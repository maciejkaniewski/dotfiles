# mako, the notification daemon of the niri session, in Dracula. mako has no
# include, so each theme is a whole config; the theme picker links
# ~/.config/mako/config to one of them.
font=FiraCode Nerd Font 11
background-color=#282a36e6
text-color=#f8f8f2
border-color=#bd93f9
# The level bar of the volume and brightness pop-ups.
progress-color=over #bd93f940
border-size=2
border-radius=12
padding=10
width=380
default-timeout=8000
max-icon-size=40
icon-location=left
# Notifications from one app stack into one, with a count.
group-by=app-name
format=<b>%s</b>\n%b

[grouped]
format=<b>%s</b>  <span alpha="60%%">(%g)</span>\n%b

# The volume and brightness pop-ups (.local/bin/osd): one line over the bar.
[app-name=osd]
format=<b>%s</b>  %b

[urgency=high]
border-color=#ff5555
border-size=3
background-color=#282a36f5
default-timeout=0
