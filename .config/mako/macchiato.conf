# mako, the notification daemon of the niri session, in Catppuccin Macchiato. mako has no
# include, so each theme is a whole config; the theme picker links
# ~/.config/mako/config to one of them.
font=FiraCode Nerd Font 11
background-color=#24273aee
text-color=#cad3f5
border-color=#b7bdf8
progress-color=over #363a4f
border-size=2
border-radius=8
padding=10
width=380
default-timeout=8000
max-icon-size=40
icon-location=left
# Notifications from one app stack into one, with a count.
group-by=app-name
format=<b>%s</b>\n%b

[grouped]
format=<b>%s</b>  <span alpha="60%%">(%g)</span>\n%b

# The volume and brightness pop-ups (.local/bin/osd): one line over the bar.
[app-name=osd]
format=<b>%s</b>  %b

[urgency=high]
border-color=#ed8796
border-size=3
background-color=#24273af5
default-timeout=0
