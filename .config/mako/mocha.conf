# mako, the notification daemon of the niri session, in Catppuccin Mocha. mako has no
# include, so each theme is a whole config; the theme picker links
# ~/.config/mako/config to one of them.
font=FiraCode Nerd Font 11
background-color=#1e1e2eee
text-color=#cdd6f4
border-color=#b4befe
progress-color=over #313244
border-size=2
border-radius=8
padding=10
width=380
default-timeout=8000
max-icon-size=40
icon-location=left
# Notifications from one app stack into one, with a count.
group-by=app-name
format=<b>%s</b>\n%b

[grouped]
format=<b>%s</b>  <span alpha="60%%">(%g)</span>\n%b

[urgency=high]
border-color=#f38ba8
border-size=3
background-color=#1e1e2ef5
default-timeout=0
