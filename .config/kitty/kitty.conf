# vim:ft=kitty
#
# ── Kitty Configuration ─────────────────────────────────────────────────────
# Author:    Maciej Kaniewski
# Theme:     picked with ./install.sh --theme (Catppuccin Frappé / Macchiato /
#            Mocha, Gruvbox Dark or Dracula); current-theme.conf links to it
# ────────────────────────────────────────────────────────────────────────────


##############################################################################
# 1) Theme (follows the theme picker)
##############################################################################

include current-theme.conf


##############################################################################
# 2) Cursor & URL behaviour
##############################################################################

cursor_shape            beam
# Animate the cursor's jumps; kitty draws it in every program, Neovim included,
# so no smear-cursor plugin is needed there
cursor_trail            3
cursor_blink_interval   -1

detect_urls             yes
show_hyperlink_targets  yes


##############################################################################
# 3) Tab Bar (placement & style — colors live in the theme file)
##############################################################################

tab_bar_min_tabs         1
tab_bar_edge             bottom
tab_bar_style            custom
tab_powerline_style      round
tab_activity_symbol      none
tab_title_template       "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{sup.index} {title}"
active_tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{sup.index} {tab.active_exe}: {title}{tab.last_focused_progress_percent and ' ' + tab.last_focused_progress_percent or ''}"


##############################################################################
# 4) Window Size, Layouts & Margins
##############################################################################

# Start size (disable remember so kitty uses these dimensions)
remember_window_size     no
initial_window_width     80c
initial_window_height    24c

# Layouts: new windows split the one you are in (side by side when it is
# wide, top/bottom when it is tall) instead of stacking in a column. * keeps
# the rest reachable with ctrl+shift+l.
enabled_layouts          splits:split_axis=auto, *

# Margins & borders (the radius only shows on full borders, which the
# margin forces when there is more than one window)
window_margin_width      6.0
window_border_radius     8.0
single_window_margin_width 0
window_border_width      1.5pt
window_padding_width     10

# Dim the text of the splits you are not in; negative = only when more than
# one window is on screen, so a lone window never fades
inactive_text_alpha      -0.4

# Close windows without asking, even while something is running in them.
# niri's Super+Q / Super+Shift+Q close on purpose; a running flash or sweep
# is the price of a mis-press.
confirm_os_window_close  0


##############################################################################
# 5) Scrollback
##############################################################################

scrollback_lines                10000
scrollback_fill_enlarged_window yes
scrollbar                       scrolled
scrollbar_interactive           yes


##############################################################################
# 6) Mouse & Clipboard
##############################################################################

mouse_hide_wait          3.0
copy_on_select           clipboard
paste_actions            quote-urls-at-prompt,replace-dangerous-control-codes,confirm-if-large

# Drop the padding that rich tables and the right-hand prompt leave at line
# ends when copying (smart: not for rectangle selections)
strip_trailing_spaces    smart

# Touchpad scroll feels sluggish at kitty's default (1.0) on Linux
touch_scroll_multiplier  10.0


##############################################################################
# 7) Shell Integration
##############################################################################

shell_integration        enabled

# Desktop notification when a command that ran 10s+ ends while this window is
# not focused (a build, a flash, a bus sweep)
notify_on_cmd_finish     unfocused 10


##############################################################################
# 8) Background & Compositing
##############################################################################

# Slight translucency; dynamic lets you change live
dynamic_background_opacity yes
background_opacity         0.95

# No linux_display_server: kitty picks X11 in an X11 session and Wayland in a
# Wayland one (Ubuntu 26.04's GNOME has no X11 session; forcing X11 there ran
# kitty under XWayland). On GNOME Wayland kitty draws its own title bar; this
# colours it like the window instead of GNOME's light or dark default.
wayland_titlebar_color     background


##############################################################################
# 9) Fonts
##############################################################################

font_family               FiraCode Nerd Font Mono
bold_font                 FiraCode Nerd Font Mono Bold
# Fira Code has no italics (kitty used its Light face instead), so italic text
# is Maple Mono NL's cursive. NL is the build without ligatures, so a comment
# never draws == or <= differently from the Fira Code beside it.
italic_font               family="Maple Mono NL" style=Italic
bold_italic_font          family="Maple Mono NL" style="Bold Italic"

# Fira Code's alternate glyphs, picked for C: ss08 keeps == as two signs (the
# default ligature is one long bar, easy to misread as =), ss02 draws <= >= as
# flat ≤ ≥, and ss03 a plain & (the default looks like δ in &x and &&). ss09
# was left out: it turns |= into ⊨ and >>= into an arrow. Set per face, by
# PostScript name; `kitten choose-fonts` previews the rest.
font_features FiraCodeNFM-Reg   +ss02 +ss03 +ss08
font_features FiraCodeNFM-Bold  +ss02 +ss03 +ss08


##############################################################################
# 10) Performance & Rendering
##############################################################################

repaint_delay            8
input_delay              1
sync_to_monitor          yes

# Undercurl for Neovim LSP diagnostics
undercurl_style          thick-sparse


##############################################################################
# 11) Key Mappings / Launchers
##############################################################################

# ctrl+1-9: jump to tab by index
map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+5 goto_tab 5
map ctrl+6 goto_tab 6
map ctrl+7 goto_tab 7
map ctrl+8 goto_tab 8
map ctrl+9 goto_tab 9
# ctrl+0: back to the tab that was active before this one
map ctrl+0 goto_tab -1

# ctrl+shift+t: new tabs start in the current directory, not $HOME
map kitty_mod+t new_tab_with_cwd

# ctrl+shift+m: zoom the current split to fill the tab, press again to restore
map kitty_mod+m toggle_layout stack

# ctrl+shift+g: lazygit over the current window, in its directory; q returns
# to it. Replaces kitty's default "last command output in less".
map kitty_mod+g launch --type=overlay --cwd=current lazygit

# alt+arrows: move to the split in that direction (ctrl+shift+[ / ] cycle)
map alt+left  neighboring_window left
map alt+right neighboring_window right
map alt+up    neighboring_window up
map alt+down  neighboring_window down

# alt+shift+arrows: swap the current split with its neighbour that way
map alt+shift+left  move_window left
map alt+shift+right move_window right
map alt+shift+up    move_window up
map alt+shift+down  move_window down

# ctrl+shift+enter: new local window in $HOME, even from an ssh session. Not
# plain new_window: kitty started from a desktop shortcut has some other cwd.
map kitty_mod+enter launch --cwd=~
# ctrl+alt+enter: new window in the current directory; from an ssh session it
# opens another ssh connection to the same host, in that directory
map ctrl+alt+enter new_window_with_cwd

# ctrl+shift+y: copy the last command's whole output to the clipboard. Not
# plain ctrl+y: zsh uses that to paste back what ctrl+u/ctrl+w cut, and Neovim
# to scroll or accept a completion.
map kitty_mod+y copy_last_command_output
