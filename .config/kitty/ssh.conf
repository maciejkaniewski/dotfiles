# vim:ft=kitty
#
# ── kitten ssh configuration ───────────────────────────────────────────────

# Local-network machines (mDNS names and 192.168.*): one ssh connection per login
# instead of one shared master. Matched against the host as typed.
# A shared master outlives the session (kitty passes ControlPersist=yes on the
# command line, so ~/.ssh/config can't override it), and with `-A` it keeps the
# forwarded agent reachable on the host after you log out, until kitty quits.
# It also pins forwarding to the first login: a later `-A` rides a master that
# was opened without it, and `ssh-add -l` on the host finds no agent.
# The cost is a password prompt per login; `ssh-copy-id <user>@<host>` avoids it.
hostname *.local 192.168.*
share_connections no
