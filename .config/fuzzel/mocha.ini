# fuzzel, the launcher niri opens on Super+D, in Catppuccin Mocha. fuzzel has no
# include, so each theme is a whole config; the theme picker links
# ~/.config/fuzzel/fuzzel.ini to one of them.
[main]
font=FiraCode Nerd Font:size=12
terminal=kitty
icon-theme=Yaru
layer=overlay
width=40
lines=12
horizontal-pad=20
vertical-pad=12
inner-pad=8

[colors]
background=1e1e2eee
text=cdd6f4ff
match=b4befeff
selection=313244ff
selection-text=cdd6f4ff
selection-match=b4befeff
border=b4befeff

[border]
width=2
radius=8
