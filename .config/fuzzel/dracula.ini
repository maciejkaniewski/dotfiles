# fuzzel, the launcher niri opens on Super+D, in Dracula. fuzzel has no
# include, so each theme is a whole config; the theme picker links
# ~/.config/fuzzel/fuzzel.ini to one of them.
[main]
font=FiraCode Nerd Font:size=12
terminal=kitty
icon-theme=Papirus-Dark
layer=overlay
width=40
lines=12
horizontal-pad=20
vertical-pad=12
inner-pad=8

[colors]
background=282a36ee
text=f8f8f2ff
match=bd93f9ff
selection=44475aff
selection-text=f8f8f2ff
selection-match=bd93f9ff
border=bd93f9ff

[border]
width=2
radius=12
