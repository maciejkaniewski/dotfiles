# fuzzel, the launcher niri opens on Super+D, in Gruvbox Dark. fuzzel has no
# include, so each theme is a whole config; the theme picker links
# ~/.config/fuzzel/fuzzel.ini to one of them.
[main]
font=FiraCode Nerd Font:size=12
# Sized like the rest of the desktop, by the screen's scale. Left on auto, fuzzel
# sizes text by the panel's DPI whenever the scale is 1: 1.7 times as big on a
# 14" 1920x1200 laptop, beside icons that stay small.
dpi-aware=no
terminal=kitty
icon-theme=Papirus-Dark
layer=overlay
width=40
lines=12
horizontal-pad=20
vertical-pad=12
inner-pad=8

[colors]
background=282828ee
text=ebdbb2ff
match=83a598ff
# The selected row filled with the accent, like Waybar's focused workspace.
selection=83a598ff
selection-text=282828ff
selection-match=282828ff
border=83a598ff

[border]
width=2
radius=12
