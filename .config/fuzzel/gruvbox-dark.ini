# fuzzel, the launcher niri opens on Super+D, in Gruvbox Dark. fuzzel has no
# include, so each theme is a whole config; the theme picker links
# ~/.config/fuzzel/fuzzel.ini to one of them.
[main]
font=FiraCode Nerd Font:size=12
terminal=kitty
icon-theme=Papirus-Dark
layer=overlay
width=40
lines=12
horizontal-pad=20
vertical-pad=12
inner-pad=8

[colors]
background=282828ee
text=ebdbb2ff
match=83a598ff
selection=3c3836ff
selection-text=ebdbb2ff
selection-match=83a598ff
border=83a598ff

[border]
width=2
radius=12
