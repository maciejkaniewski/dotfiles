# fuzzel, the launcher niri opens on Super+D, in Catppuccin Frappé. fuzzel has no
# include, so each theme is a whole config; the theme picker links
# ~/.config/fuzzel/fuzzel.ini to one of them.
[main]
font=FiraCode Nerd Font:size=12
terminal=kitty
icon-theme=Yaru
layer=overlay
width=40
lines=12
horizontal-pad=20
vertical-pad=12
inner-pad=8

[colors]
background=303446ee
text=c6d0f5ff
match=babbf1ff
selection=414559ff
selection-text=c6d0f5ff
selection-match=babbf1ff
border=babbf1ff

[border]
width=2
radius=8
