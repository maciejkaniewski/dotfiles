# fuzzel, the launcher niri opens on Super+D, in Catppuccin Macchiato. fuzzel has no
# include, so each theme is a whole config; the theme picker links
# ~/.config/fuzzel/fuzzel.ini to one of them.
[main]
font=FiraCode Nerd Font:size=12
terminal=kitty
icon-theme=Papirus-Dark
layer=overlay
width=40
lines=12
horizontal-pad=20
vertical-pad=12
inner-pad=8

[colors]
background=24273aee
text=cad3f5ff
match=b7bdf8ff
selection=363a4fff
selection-text=cad3f5ff
selection-match=b7bdf8ff
border=b7bdf8ff

[border]
width=2
radius=12
